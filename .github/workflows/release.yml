name: Release APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName, for example 1.0.0"
        required: true
        default: "1.0"
        type: string
      version_code:
        description: "versionCode (integer, must increase for every release)"
        required: true
        default: "1"
        type: string
      endpoint_url:
        description: "Published GLM collector JSON (HTTPS)"
        required: true
        default: "https://yuntianming1874-design.github.io/ai-offer-radar/glm-coding-plan.json"
        type: string
      sign_release:
        description: "Sign with the release keystore from repository secrets"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate inputs
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
          ENDPOINT_URL: ${{ inputs.endpoint_url }}
        run: |
          case "$VERSION_CODE" in
            ''|*[!0-9]*) echo "::error::version_code must be a positive integer"; exit 2 ;;
          esac
          test "$VERSION_CODE" -gt 0 || { echo "::error::version_code must be > 0"; exit 2; }
          test -n "$VERSION_NAME" || { echo "::error::version_name is required"; exit 2; }
          case "$ENDPOINT_URL" in
            https://*) ;;
            *) echo "::error::endpoint_url must use https"; exit 2 ;;
          esac

      - name: Check release signing secrets
        if: ${{ inputs.sign_release }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=0
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured. Set the four release secrets or run with sign_release=false."
              missing=1
            fi
          done
          exit "$missing"

      - name: Decode release keystore
        if: ${{ inputs.sign_release }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"

      - name: Build and test signed release
        env:
          ENDPOINT_URL: ${{ inputs.endpoint_url }}
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
          SIGN_RELEASE: ${{ inputs.sign_release }}
          RELEASE_KEYSTORE_PATH: ${{ inputs.sign_release && format('{0}/release.keystore', runner.temp) || '' }}
          RELEASE_KEYSTORE_PASSWORD: ${{ inputs.sign_release && secrets.RELEASE_KEYSTORE_PASSWORD || '' }}
          RELEASE_KEY_ALIAS: ${{ inputs.sign_release && secrets.RELEASE_KEY_ALIAS || '' }}
          RELEASE_KEY_PASSWORD: ${{ inputs.sign_release && secrets.RELEASE_KEY_PASSWORD || '' }}
        run: |
          ./gradlew --no-daemon testDebugUnitTest assembleRelease \
            -PglmCollectorUrl="$ENDPOINT_URL" \
            -PreleaseVersionCode="$VERSION_CODE" \
            -PreleaseVersionName="$VERSION_NAME"

      - name: Verify endpoint BuildConfig
        env:
          ENDPOINT_URL: ${{ inputs.endpoint_url }}
        run: |
          BUILD_CONFIG="app/build/generated/source/buildConfig/release/com/aioffer/radar/BuildConfig.java"
          test -f "$BUILD_CONFIG"
          grep -F "$ENDPOINT_URL" "$BUILD_CONFIG"

      - name: Verify APK signature
        if: ${{ inputs.sign_release }}
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/*.apk

      - name: Collect artifact and checksum
        id: artifact
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          SIGN_RELEASE: ${{ inputs.sign_release }}
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -1)
          test -n "$APK"
          if [ "$SIGN_RELEASE" = "true" ]; then
            SUFFIX=signed
          else
            SUFFIX=unsigned
          fi
          NAME="ai-offer-radar-${VERSION_NAME}-${SUFFIX}.apk"
          cp "$APK" "$RUNNER_TEMP/$NAME"
          DIGEST=$(sha256sum "$RUNNER_TEMP/$NAME" | awk '{print $1}')
          echo "sha256=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "path=$RUNNER_TEMP/$NAME" >> "$GITHUB_OUTPUT"
          {
            echo "### Release APK"
            echo ""
            echo "- versionName: \`$VERSION_NAME\`"
            echo "- versionCode: \`${{ inputs.version_code }}\`"
            echo "- signed: \`$SIGN_RELEASE\`"
            echo "- endpoint: \`${{ inputs.endpoint_url }}\`"
            echo "- SHA-256: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-offer-radar-release
          path: ${{ runner.temp }}/ai-offer-radar-*.apk
          if-no-files-found: error
          retention-days: 14
